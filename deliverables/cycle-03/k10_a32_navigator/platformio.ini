; NOTE: This project builds with arduino-cli, not PlatformIO.
; PlatformIO cannot resolve the DFRobot UNIHIKER board libraries.
;
; arduino-cli is at: C:\Users\antfr\AppData\Local\arduino-cli.exe
; Board FQBN: UNIHIKER:esp32:k10
;
; Command reference (or use Terminal > Run Task in VSCode):
;   arduino-cli compile --fqbn UNIHIKER:esp32:k10 .
;   arduino-cli upload  --fqbn UNIHIKER:esp32:k10 --port COM3 .
;   python deploy_fs.py --port COM3        (LittleFS — uploads data/ttdb.md)
;   arduino-cli monitor --fqbn UNIHIKER:esp32:k10 --port COM3 --config baudrate=115200
;   arduino-cli board list                 (find your COM port)
